<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Surprise</title>
  <link rel="stylesheet" href="index.css">
  
</head>

<body>
  <div id="nameOverlay">
    <h2>Enter Your Name</h2>
    <input type="text" id="nameInput" placeholder="Type your name...">
    <button id="submitName">Submit</button>
  </div>
  <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWN2cHBzaG10bnZ4MzBqNHhwdnRwazhxYzd2cXRuNzQ1OGs1ZzI5aCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/c76IJLufpNwSULPk77/giphy.gif" alt="Valentine's Day" id="valentineImage">
  <h1 id="valentineMessage">Will you be my Valentine, <span id="namePlaceholder">......</span>?</h1>

  <div class="buttons">
    <button id="yes" onclick="changeYesText()">
      <span class="label">YES-: </span>
      <span class="message">Click me!</span>
    </button>
    <button id="no" onclick="shrinkNoButton()">
      <span class="label">No-:</span>
      <span class="message">Don't click!</span>
    </button>
  </div>




<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="index.js"></script>
</body>
</html>
